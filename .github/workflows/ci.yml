name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installing the project (rather than just running pytest against the
      # source tree) is the point: a broken build backend once made every
      # `pip install .` fail while the tests still passed locally.
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Console script is wired up
        run: chroma-bench --help

      - name: Test
        run: python -m pytest -q
